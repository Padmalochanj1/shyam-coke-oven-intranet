<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coke Oven Intranet</title>
<style>
:root{--bg:#f2f5f9;--card:#fff;--tx:#14263a;--mu:#6b7c8f;--pr:#e8590c;--nv:#10243a;--bd:#e1e7ee;--ok:#2b9348;--wn:#e8a100;--er:#d62839}
[data-t=dark]{--bg:#0d1722;--card:#15263a;--tx:#e7eef6;--mu:#8fa3b8;--bd:#233a52}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI,Arial;background:var(--bg);color:var(--tx)}
.hidden{display:none!important}button{cursor:pointer;font:inherit}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
label{display:block;font-weight:600;font-size:12px;color:var(--mu);margin-bottom:12px}label>*{margin-top:5px;font-weight:400}
.btn{background:var(--pr);color:#fff;border:0;padding:10px 16px;border-radius:8px;font-weight:600;transition:.15s}.btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.ok{background:var(--ok)}.btn.er{background:var(--er)}.btn.s{padding:6px 10px;font-size:12px}
#login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#e8590c55,transparent 40%),radial-gradient(circle at 80% 80%,#1c5d9955,transparent 45%),var(--nv);overflow:hidden;position:relative}
.ember{position:absolute;bottom:-10px;width:6px;height:6px;border-radius:50%;background:#ff9f43;animation:up 6s linear infinite;opacity:0}
@keyframes up{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-100vh) translateX(40px)}}
.lc{background:var(--card);padding:34px;border-radius:16px;width:min(380px,92vw);position:relative;box-shadow:0 20px 60px #0008;animation:pop .5s}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.logo{width:48px;height:48px;border-radius:12px;background:var(--pr);color:#fff;display:grid;place-items:center;font-weight:800;margin-bottom:10px}
#app{display:flex;min-height:100vh}aside{width:230px;background:var(--nv);color:#cfe0f1;padding:16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
aside .nv{background:none;border:0;color:inherit;text-align:left;padding:11px 12px;border-radius:8px;display:flex;gap:10px;transition:.15s}
aside .nv:hover{background:#ffffff14}aside .nv.on{background:var(--pr);color:#fff}
main{flex:1;padding:22px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px;animation:pop .3s}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stat{cursor:pointer;transition:.2s}.stat:hover{transform:translateY(-3px);box-shadow:0 8px 20px #0002}.stat b{font-size:30px;display:block}.stat span{color:var(--mu);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.pill{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;color:#fff;display:inline-block}
.p-published,.p-Closed{background:var(--ok)}.p-pending,.p-Open{background:var(--wn)}.p-rejected{background:var(--er)}.p-In\ Progress{background:#1c7ed6}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.drop{border:2px dashed var(--bd);border-radius:12px;padding:22px;text-align:center;color:var(--mu);transition:.2s}.drop.ov{border-color:var(--pr);background:#e8590c12}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mu{color:var(--mu);font-size:12px}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:50;padding:16px}.mb{background:var(--card);border-radius:14px;padding:18px;width:min(900px,100%);max-height:92vh;overflow:auto}
iframe{width:100%;height:70vh;border:0;border-radius:8px}img.pv{max-width:100%;border-radius:8px}
#toasts{position:fixed;right:16px;bottom:16px;z-index:99;display:grid;gap:8px}.toast{background:var(--nv);color:#fff;padding:12px 16px;border-radius:10px;border-left:4px solid var(--pr);animation:pop .3s}
.bars{display:flex;gap:10px;align-items:flex-end;height:110px}.bars div{flex:1;background:var(--pr);border-radius:6px 6px 0 0;min-height:4px;transition:height .8s;position:relative}.bars small{position:absolute;top:-16px;width:100%;text-align:center}
@media(max-width:760px){aside{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;overflow:auto;z-index:20}aside .nv span,aside .bt{display:none}main{padding:14px 14px 80px}.row{grid-template-columns:1fr}#app{display:block}}
</style></head><body>
<div id="login"><form class="lc" id="lf"><div class="logo">CO</div><h2 style="margin:0">Coke Oven Intranet</h2><p class="mu">Department portal · authorised users only</p>
<label>Username<input id="u" autocomplete="username" required></label><label>Password<input id="p" type="password" autocomplete="current-password" required></label>
<button class="btn" style="width:100%">Sign in</button><p id="lm" class="mu"></p></form></div>
<div id="app" class="hidden"><aside><div style="font-weight:800;margin:4px 8px 14px">🔥 COKE OVEN</div><div id="nav" style="display:grid;gap:4px"></div>
<div class="bt" style="margin-top:auto;display:grid;gap:6px"><button class="btn g s" id="th" style="color:#cfe0f1">🌓 Theme</button><button class="btn g s" id="lo" style="color:#cfe0f1">Sign out</button></div></aside>
<main><div class="top"><div><h2 id="pt" style="margin:0"></h2><span class="mu" id="who"></span></div><button class="btn g s" id="rf">↻ Refresh</button></div><div id="pg"></div></main></div>
<div id="toasts"></div><div id="md" class="modal hidden"><div class="mb" id="mb"></div></div>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="js/config.js"></script>
<script>
const $=s=>document.querySelector(s),API=APP_CONFIG.API_BASE_URL;let ME,DOCS=[],REP=[],page='dash',fCat='All',fSt='All';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>new Date(d).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'});
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;$('#toasts').append(e);setTimeout(()=>e.remove(),3800)}
async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(sessionStorage.tk||''),...o.headers}});
 if(r.status===401&&p!=='/api/login'){logout();throw Error('Session expired')}
 if(!r.ok){let m='Request failed';try{m=(await r.json()).error}catch{}throw Error(m)}return r}
const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b)}).then(r=>r.json());
function logout(){sessionStorage.clear();location.reload()}
for(let i=0;i<24;i++){const e=document.createElement('i');e.className='ember';e.style.cssText=`left:${Math.random()*100}%;animation-delay:${Math.random()*6}s;animation-duration:${4+Math.random()*4}s`;$('#login').append(e)}
$('#lf').onsubmit=async e=>{e.preventDefault();$('#lm').textContent='Signing in…';try{const d=await post('/api/login',{username:$('#u').value,password:$('#p').value});sessionStorage.tk=d.token;ME=d.user;start()}catch(x){$('#lm').textContent=x.message}};
$('#lo').onclick=logout;$('#th').onclick=()=>{const d=document.documentElement;d.dataset.t=d.dataset.t==='dark'?'':'dark';localStorage.th=d.dataset.t};document.documentElement.dataset.t=localStorage.th||'';
$('#rf').onclick=()=>load(true);
async function start(){if(!ME&&sessionStorage.tk)try{ME=(await api('/api/me').then(r=>r.json())).user}catch{return}if(!ME)return;
 $('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#who').textContent=`${ME.displayName} · ${ME.role.toUpperCase()}${ME.role==='manager'?' · '+ME.department:''}`;
 const N=[['dash','▦','Dashboard'],['docs','▤','Documents'],['safe','⚠','Safety Reports']];if(ME.role!=='user')N.push(['mon','▥','Safety Action']);
 if(ME.role==='hod')N.push(['appr','✓','Approvals'],['adm','⚙','Users']);
 $('#nav').innerHTML=N.map(n=>`<button class="nv" data-p="${n[0]}">${n[1]} <span>${n[2]}</span></button>`).join('');
 document.querySelectorAll('.nv').forEach(b=>b.onclick=()=>go(b.dataset.p));await load();go('dash')}
async function load(t){try{[DOCS,REP]=await Promise.all([api('/api/documents').then(r=>r.json()).then(d=>d.documents),api('/api/safety').then(r=>r.json()).then(d=>d.reports)]);render();if(t)toast('Refreshed')}catch(e){toast(e.message)}}
function go(p){page=p;document.querySelectorAll('.nv').forEach(b=>b.classList.toggle('on',b.dataset.p===p));render()}
function render(){const T={dash:'Dashboard',docs:'Document Repository',safe:'Site Safety Reporting',mon:'Safety Action Centre',appr:'Document Approvals',adm:'Users'};$('#pt').textContent=T[page];({dash,docs,safe,mon,appr,adm})[page]()}
function count(el,n){let i=0;const s=Math.max(1,Math.ceil(n/20)),t=setInterval(()=>{i=Math.min(n,i+s);el.textContent=i;if(i>=n)clearInterval(t)},30)}
function dash(){const pub=DOCS.filter(d=>d.status==='published').length,pen=DOCS.filter(d=>d.status==='pending').length,op=REP.filter(r=>r.status!=='Closed').length,cl=REP.filter(r=>r.status==='Closed').length;
 const dep=['Operation','Electrical','Mechanical'].map(d=>[d,REP.filter(r=>r.responsibility===d&&r.status!=='Closed').length]),mx=Math.max(1,...dep.map(x=>x[1]));
 $('#pg').innerHTML=`<div class="stats">${[['Published docs',pub,'docs'],['Pending approval',pen,ME.role==='hod'?'appr':'docs'],['Open safety reports',op,ME.role==='user'?'safe':'mon'],['Closed',cl,'safe']].map(s=>`<div class="card stat" onclick="go('${s[2]}')"><span>${s[0]}</span><b data-n="${s[1]}">0</b></div>`).join('')}</div>
 <div class="row"><div class="card"><h3 style="margin-top:0">Open reports by responsibility</h3><div class="bars">${dep.map(d=>`<div style="height:${d[1]/mx*100}%"><small>${d[1]}</small></div>`).join('')}</div><div class="bars" style="height:auto;margin-top:6px">${dep.map(d=>`<span class="mu" style="flex:1;text-align:center">${d[0]}</span>`).join('')}</div></div>
 <div class="card"><h3 style="margin-top:0">Quick actions</h3><div style="display:grid;gap:8px"><button class="btn" onclick="go('docs');setTimeout(docForm,50)">＋ Upload document</button><button class="btn g" onclick="go('safe');setTimeout(safeForm,50)">⚠ Report unsafe act / condition</button></div></div></div>`;
 document.querySelectorAll('[data-n]').forEach(e=>count(e,+e.dataset.n))}
function docCard(d,act){return`<div class="card"><span class="pill p-${d.status}">${d.status}</span> <span class="mu">${esc(d.category)}</span><h4 style="margin:8px 0 4px">${esc(d.title)}</h4><div class="mu">${esc(d.documentNumber||'—')} · Rev ${esc(d.revision)}<br>By ${esc(d.submittedByName)} · ${fmt(d.createdAt)}${d.remarks?`<br>Remarks: ${esc(d.remarks)}`:''}</div>
<div style="margin-top:10px;display:flex;gap:6px"><button class="btn s" onclick="view('${d.fileUrl}','pdf')">👁 View</button>${act?`<button class="btn ok s" onclick="review('${d.id}','approve')">Approve</button><button class="btn er s" onclick="review('${d.id}','reject')">Reject</button>`:''}</div></div>`}
function docs(){const cats=['All','SOP','HIRA','SMP','Electrical Drawing','Maintenance Procedure','Checklist / Format','Other'];
 $('#pg').innerHTML=`<div style="display:flex;gap:8px;margin-bottom:12px"><input id="q" placeholder="🔍 Search title / number…"><button class="btn" style="white-space:nowrap" onclick="docForm()">＋ Upload</button></div><div id="df"></div>
 <div class="chips">${cats.map(c=>`<button class="chip ${c===fCat?'on':''}" onclick="fCat='${c}';docs()">${c}</button>`).join('')}</div><div class="grid" id="dl"></div>`;
 const draw=()=>{const q=$('#q').value.toLowerCase();const l=DOCS.filter(d=>(d.status==='published'||d.submittedBy===ME.username||ME.role==='hod')&&(fCat==='All'||d.category===fCat)&&(d.title+d.documentNumber).toLowerCase().includes(q));$('#dl').innerHTML=l.map(d=>docCard(d)).join('')||'<p class="mu">No documents found.</p>'};$('#q').oninput=draw;draw()}
function dropzone(id,acc,label){return`<div class="drop" id="${id}z">${label}<br><input type="file" id="${id}" accept="${acc}" class="hidden"><button type="button" class="btn g s" onclick="$('#${id}').click()" style="margin-top:8px">Browse</button><div id="${id}i" class="mu" style="margin-top:8px"></div></div>`}
function wireDrop(id){const z=$('#'+id+'z'),f=$('#'+id);['dragover','dragleave','drop'].forEach(ev=>z.addEventListener(ev,e=>{e.preventDefault();z.classList.toggle('ov',ev==='dragover');if(ev==='drop'){f.files=e.dataTransfer.files;f.onchange()}}));f.onchange=()=>$('#'+id+'i').textContent=f.files[0]?f.files[0].name+' ('+(f.files[0].size/1024).toFixed(0)+' KB)':''}
function docForm(){$('#df').innerHTML=`<form class="card" id="dfm"><h3 style="margin-top:0">Upload document for HOD approval</h3><div class="row"><label>Category<select id="dc"><option>SOP<option>HIRA<option>SMP<option>Electrical Drawing<option>Maintenance Procedure<option>Checklist / Format<option>Other</select></label><label>Title<input id="dt" required></label><label>Document No.<input id="dn"></label><label>Revision<input id="dr" value="00" required></label></div>
${dropzone('dfile','application/pdf,image/*','Drag &amp; drop PDF or image here (compressed, stamped with date-time &amp; saved as PDF)')}<p class="mu">Word/Excel/PPT: save as PDF first — Office conversion needs a server-side converter (see notes).</p><button class="btn">Upload</button> <button type="button" class="btn g" onclick="$('#df').innerHTML=''">Cancel</button> <span id="dm" class="mu"></span></form>`;wireDrop('dfile');
 $('#dfm').onsubmit=async e=>{e.preventDefault();const f=$('#dfile').files[0];if(!f)return toast('Choose a file');$('#dm').textContent='Compressing & converting…';
  try{const b64=await toPdf(f);toast(`Compressed to ${(b64.length*.75/1024).toFixed(0)} KB`);await post('/api/documents/submit',{category:$('#dc').value,title:$('#dt').value,documentNumber:$('#dn').value,revision:$('#dr').value,mimeType:'application/pdf',fileBase64:b64});toast('Submitted for HOD approval ✔');await load();docs()}catch(x){$('#dm').textContent=x.message;toast(x.message)}}}
const b64of=u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode(...u8.subarray(i,i+8192));return btoa(s)};
const img=f=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>j(Error('Unreadable image'));i.src=URL.createObjectURL(f)});
function shrink(i,max){const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);return c}
const blobOf=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));
async function toPdf(f){const {PDFDocument,StandardFonts,rgb}=PDFLib;let pdf;
 if(f.type==='application/pdf')pdf=await PDFDocument.load(await f.arrayBuffer());
 else if(f.type.startsWith('image/')){pdf=await PDFDocument.create();const c=shrink(await img(f),1600),j=await pdf.embedJpg(await (await blobOf(c,'image/jpeg',.7)).arrayBuffer()),p=pdf.addPage([595,842]),k=Math.min(535/j.width,780/j.height);p.drawImage(j,{x:30,y:50+(780-j.height*k)/2,width:j.width*k,height:j.height*k})}
 else throw Error('Only PDF or image files are supported');
 const fn=await pdf.embedFont(StandardFonts.Helvetica),t=`Uploaded ${new Date().toLocaleString('en-IN')} by ${ME.displayName} (${ME.username})`;
 pdf.getPages().forEach(p=>p.drawText(t,{x:20,y:10,size:7,font:fn,color:rgb(.4,.4,.4)}));
 const out=await pdf.save({useObjectStreams:true});if(out.length*1.34>11e6)throw Error('File is over 8 MB even after compression');return b64of(out)}
async function toPng(f){const c=shrink(await img(f),1280),x=c.getContext('2d');x.font='14px sans-serif';x.fillStyle='#000a';x.fillRect(0,c.height-24,c.width,24);x.fillStyle='#fff';x.fillText(new Date().toLocaleString('en-IN'),8,c.height-7);
 const b=await blobOf(c,'image/png');return b64of(new Uint8Array(await b.arrayBuffer()))}
async function view(u,k){try{const b=await api(u.replace(API,'')).then(r=>r.blob()),o=URL.createObjectURL(b);modal(k==='pdf'?`<iframe src="${o}"></iframe>`:`<img class="pv" src="${o}">`)}catch(e){toast(e.message)}}
function modal(h){$('#mb').innerHTML=h+'<p><button class="btn g" onclick="$(\'#md\').classList.add(\'hidden\')">Close</button></p>';$('#md').classList.remove('hidden')}
function ask(title,need,cb){modal(`<h3>${title}</h3><label>Remarks${need?' (required)':''}<textarea id="rk" rows="3"></textarea></label><button class="btn" id="ok">Confirm</button>`);$('#ok').onclick=async()=>{const v=$('#rk').value.trim();if(need&&!v)return toast('Remarks required');try{await cb(v);$('#md').classList.add('hidden');await load()}catch(e){toast(e.message)}}}
const review=(id,d)=>ask(d==='approve'?'Approve & publish':'Reject document',d==='reject',async r=>{await post('/api/documents/review',{id,decision:d,remarks:r});toast(d==='approve'?'Published ✔':'Rejected')});
function appr(){const l=DOCS.filter(d=>d.status==='pending');$('#pg').innerHTML=`<div class="grid">${l.map(d=>docCard(d,1)).join('')||'<p class="mu">🎉 Nothing pending.</p>'}</div>`}
function repCard(r,act){return`<div class="card"><span class="pill p-${r.status}">${r.status}</span> <span class="pill" style="background:${r.type==='Unsafe Act'?'#d62839':'#6741d9'}">${r.type}</span> <span class="pill" style="background:#495057">${r.responsibility}</span> <span class="mu">${r.priority}</span><h4 style="margin:8px 0 4px">${esc(r.location)}</h4><div>${esc(r.description)}</div><div class="mu" style="margin-top:6px">${r.id}<br>By ${esc(r.reportedByName)} · ${fmt(r.createdAt)}${r.closureRemarks?`<br>Closure: ${esc(r.closureRemarks)}`:''}</div>
<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">${r.imageUrl?`<button class="btn g s" onclick="view('${r.imageUrl}','img')">🖼 Photo</button>`:''}${act&&r.status!=='Closed'?`${r.status==='Open'?`<button class="btn g s" onclick="upd('${r.id}','In Progress')">Start work</button>`:''}<button class="btn ok s" onclick="upd('${r.id}','Closed')">Close</button>`:''}</div></div>`}
const upd=(id,s)=>ask(s==='Closed'?'Close report':'Mark in progress',s==='Closed',async r=>{await post('/api/safety/update',{id,status:s,remarks:r});toast('Updated ✔')});
function safe(){$('#pg').innerHTML=`<button class="btn" onclick="safeForm()" style="margin-bottom:12px">＋ New report</button><div id="sf"></div><div class="grid">${REP.filter(r=>r.reportedBy===ME.username||ME.role==='hod').map(r=>repCard(r)).join('')||'<p class="mu">No reports yet.</p>'}</div>`}
function safeForm(){$('#sf').innerHTML=`<form class="card" id="sfm"><h3 style="margin-top:0">New safety observation</h3><div class="row"><label>Type<select id="st"><option>Unsafe Act<option>Unsafe Condition</select></label><label>Responsibility<select id="sr"><option>Operation<option>Electrical<option>Mechanical</select></label><label>Location / equipment<input id="sl" required></label><label>Priority<select id="sp"><option>Medium<option>Low<option>High</select></label></div><label>Description<textarea id="sd" rows="3" required></textarea></label>
${dropzone('sfile','image/*','Drag &amp; drop photo (auto-resized &amp; converted to PNG)')}<br><button class="btn">Submit</button> <button type="button" class="btn g" onclick="$('#sf').innerHTML=''">Cancel</button> <span id="sm" class="mu"></span></form>`;wireDrop('sfile');
 $('#sfm').onsubmit=async e=>{e.preventDefault();$('#sm').textContent='Processing…';try{const f=$('#sfile').files[0];await post('/api/safety/create',{type:$('#st').value,responsibility:$('#sr').value,location:$('#sl').value,priority:$('#sp').value,description:$('#sd').value,imageBase64:f?await toPng(f):null});toast('Report submitted ✔');await load();safe()}catch(x){$('#sm').textContent=x.message;toast(x.message)}}}
function mon(){const l=REP.filter(r=>ME.role==='hod'||r.responsibility===ME.department),s=['All','Open','In Progress','Closed'];
 $('#pg').innerHTML=`<div class="chips">${s.map(c=>`<button class="chip ${c===fSt?'on':''}" onclick="fSt='${c}';mon()">${c}</button>`).join('')}</div><div class="grid">${l.filter(r=>fSt==='All'||r.status===fSt).map(r=>repCard(r,1)).join('')||'<p class="mu">Nothing here.</p>'}</div>`}
async function adm(){try{const u=(await api('/api/admin/users').then(r=>r.json())).users;$('#pg').innerHTML=`<div class="card">${u.map(x=>`<p><b>${esc(x.displayName)}</b> · ${esc(x.username)} · ${x.role} · ${esc(x.department)}</p>`).join('')}<p class="mu">Add users via tools/password-hash.html → database/users.json.</p></div>`}catch(e){toast(e.message)}}
if(sessionStorage.tk)start();
</script></body></html>
